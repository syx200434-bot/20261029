<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js 角色動畫</title>

  <style>
    /* 移除瀏覽器預設邊距。 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f2e8cf;
    }

    /* 移除畫布下方可能出現的空白。 */
    canvas {
      display: block;
    }
  </style>

  <!-- 載入 p5.js 函式庫。 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
</head>

<body>
  <!-- 載入同一層的 sketch.js。 -->
  <script src="sketch.js"></script>
</body>
</html>
